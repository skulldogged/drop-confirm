modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "${mod_issue_tracker}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = "${mod_description}"
authors = "${mod_author}"
${neoforge_icon_property} = "drop_confirm.png"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${loader_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_range}"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "${config_lib}"
versionRange = "[${config_lib_version},)"
type = "required"
side = "CLIENT"
